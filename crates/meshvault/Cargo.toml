[package]
name = "meshvault"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "MIT"
description = "Meshvault: view Roblox meshes and their materials, and bulk download a game's models."
authors = ["Jaden Hills"]
publish = false

[dependencies]
rbx_mesh = { path = "../rbx_mesh", default-features = false, features = ["mesh-v1", "mesh-v7-draco", "union-graphics", "csgphs-v8-zstd"] }
eframe = "0.37.0"
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tga", "webp", "gif"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", features = ["gzip"] }
flate2 = "1.1.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
dirs = "7.0.0"
bytemuck = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[target.'cfg(windows)'.build-dependencies]
# the executable's icon and version information (build.rs)
winresource = "0.1.34"

[dev-dependencies]
# the exporter tests run the served Luau exporters against a stand-in for Studio
mlua = { version = "0.12", features = ["luau"] }
# the shader tests parse mesh.wgsl with naga; keep it in step with the version wgpu uses
naga = { version = "30.0.1", features = ["wgsl-in"] }
