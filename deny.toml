# cargo-deny policy: `cargo deny check`.
# Checks what ships in the release build, so the graph is the Windows target only
# (the v1 platform) without dev-dependencies. Widen `targets` when other platforms ship.

[graph]
targets = ["x86_64-pc-windows-msvc"]
exclude-dev = true
all-features = false

[advisories]
# Vulnerabilities always fail. Unmaintained crates fail too unless listed here with a reason.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Everything here is compatible with shipping an MIT binary. MPL-2.0 is file-level copyleft
# (option-ext, via dirs): unmodified, its source stays available on crates.io.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
# Duplicate versions are common in the wgpu/winit tree; report them, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
