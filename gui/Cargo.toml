[package]
name = "meshvault"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "Meshvault: view Roblox meshes and their materials, and bulk download a game's models."
publish = false

[dependencies]
rbx_mesh = { path = ".." }
binrw = "0.15.0"
eframe = "0.37.0"
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tga", "webp", "gif"] }
resvg = { version = "0.45", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.4.2", features = ["gzip"] }
flate2 = "1.1.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
dirs = "7.0.0"
bytemuck = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
